
# Temple of the Axolotl - NeoForge Mod Metadata

modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="DevAxo"
description='''
Temple of the Axolotl introduces celestial cuisine,
legendary artifacts, and The Axolotl Above All.

Discover divine sushi, craft powerful equipment,
and earn the blessing of the celestial axolotl.
'''

# ==================================================
# NeoForge dependency
# ==================================================

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

# ==================================================
# Minecraft dependency
# ==================================================

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# ==================================================
# Vanilla Backport dependency
# Required for newer vanilla ingredients,
# including open and closed eyeblossoms.
# ==================================================

[[dependencies.${mod_id}]]
modId="vanillabackport"
type="required"
reason="Required for celestial sushi ingredients."
versionRange="[1.1.7.10,)"
ordering="AFTER"
side="BOTH"

# ==================================================
# Platform dependency
# Required by Vanilla Backport.
# ==================================================

[[dependencies.${mod_id}]]
modId="platform"
type="required"
reason="Required for Vanilla Backport compatibility."
versionRange="[1.3.3,)"
ordering="AFTER"
side="BOTH"
