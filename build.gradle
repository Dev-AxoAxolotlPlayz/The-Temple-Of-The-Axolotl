
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as not to have to always do so
    // when updating gradlew.properties.
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude development-only resources from finalized outputs.
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    maven {
        name = 'GeckoLib'
        url = uri('https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/')
    }
}

base {
    archivesName = mod_id
}

// Minecraft 1.21.1 targets Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Access Transformers are automatically detected.
    // accessTransformers = project.files(
    //     'src/main/resources/META-INF/accesstransformer.cfg'
    // )

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            programArguments.addAll(
                    '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
            )
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Runtime-only dependencies that should not be published
// as dependencies of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation 'software.bernie.geckolib:geckolib-neoforge-1.21.1:4.7.1'

    // Optional JEI dependency examples:
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Local mod JAR example:
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Direct file dependency example:
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Sister project dependency example:
    // implementation project(":myproject")
}

// Generate mod metadata from templates.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]

    inputs.properties replaceProperties
    expand replaceProperties

    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include generated mod metadata in resources.
sourceSets.main.resources.srcDir generateModMetadata

// Generate metadata automatically when IntelliJ syncs.
neoForge.ideSyncTask generateModMetadata

// Maven publishing configuration.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }

    repositories {
        maven {
            url = layout.projectDirectory.dir('repo').asFile.toURI()
        }
    }
}

// Java compilation settings.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    // Print the exact source file, line number, and API
    // responsible for Java deprecation warnings.
    options.compilerArgs += ['-Xlint:deprecation']
}

// Download dependency sources and documentation for IntelliJ.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
